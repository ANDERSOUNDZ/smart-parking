<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ titulo() }}</mat-card-title>
    <mat-card-subtitle>{{ subtitulo() }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ng-content />
    <div class="grafica">
      <canvas baseChart [type]="tipo()" [data]="datos()" [options]="opciones()"></canvas>
    </div>
    <ng-content select="[pie]" />
  </mat-card-content>
</mat-card>
