<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <mat-nav-list>
      @for (opcion of menu; track opcion.ruta) {
        <a mat-list-item [routerLink]="opcion.ruta" routerLinkActive #activa="routerLinkActive"
           [activated]="activa.isActive">
          {{ opcion.texto }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
