<div class="pagina">
  <div class="fila">
    <h2>Espacios</h2>
    <span class="espaciador"></span>
    <button matButton="filled" (click)="nuevo()">Nuevo espacio</button>
  </div>

  <mat-card appearance="outlined">
    <table mat-table [dataSource]="tabla" [trackBy]="porId">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Espacio</th>
        <td mat-cell *matCellDef="let fila">E-{{ fila.id }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let fila" [class]="fila.ocupado ? 'texto-ocupado' : 'texto-libre'">
          {{ fila.ocupado ? 'Ocupado' : 'Disponible' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="reserva">
        <th mat-header-cell *matHeaderCellDef>Reserva activa</th>
        <td mat-cell *matCellDef="let fila">{{ fila.reserva ? '#' + fila.reserva : '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let fila">
          <div class="fila">
            <app-boton-espacio [espacio]="fila" />
            <button matButton (click)="eliminar(fila)" [disabled]="!!fila.reserva" disabledInteractive
                    matTooltip="Para eliminarlo, primero libéralo" [matTooltipDisabled]="!fila.reserva">
              Eliminar
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" />
  </mat-card>
</div>
