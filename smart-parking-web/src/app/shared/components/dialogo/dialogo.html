<h2 mat-dialog-title>{{ datos.titulo }}</h2>
<mat-dialog-content>
  @if (pideNumero) {
    <mat-form-field>
      <mat-label>{{ datos.mensaje }}</mat-label>
      <input matInput type="number" min="1" step="1" required [(ngModel)]="numero" />
    </mat-form-field>
  } @else {
    {{ datos.mensaje }}
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton="filled" [mat-dialog-close]="pideNumero ? numero : true" [disabled]="!valido()">Aceptar</button>
</mat-dialog-actions>
